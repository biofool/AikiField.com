<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 972" font-family="'Public Sans', system-ui, sans-serif" role="img" aria-labelledby="ov-title ov-desc">
  <title id="ov-title">AikiField Sponsored Projects — Overview</title>
  <desc id="ov-desc">Seven sponsored projects built and operated by AikiField — Quantum Aikido Wisdom (AI coaching), World Studio Finder (outreach pipeline), MultiCloud-MultiPass (cloud cost control), ChaosEngine (resilience engineering), ClipQuotes (media intelligence), Voice Synthesis Benchmarking (AI governance) and Story Gatherer (knowledge graph) — each with its principal technologies, all standing on a shared substrate: Python in all seven systems, Docker, OpenTofu/Terraform and SQLite in four each, Cloud Run and Flask in three each, and FastAPI, Firestore and Gemini in two each.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E4E44"/>
    </marker>
  </defs>

