<svg xml:lang="fr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" font-family="Noto Sans JP, Noto Sans SC, Noto Sans KR, Noto Naskh Arabic, Noto Sans Hebrew, Noto Sans Devanagari, Public Sans, sans-serif" role="img" aria-labelledby="ov-title ov-desc">
  <title id="ov-title">AikiField Projets Sponsorisés — Vue d'ensemble</title>
  <desc id="ov-desc">Deux projets sponsorisés issus d'AikiField : AikiField AI Chat (coaching IA) et World Studio Finder (découverte et rayonnement de studios mondiaux).</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E4E44"/>
    </marker>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5FD3B2"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1120" height="760" fill="#F6F2EA"/>

  <!-- sponsor node -->
  <rect x="360" y="28" width="400" height="64" rx="14" fill="#0E4E44"/>
  <text x="560" y="56" text-anchor="middle" fill="#fff" font-family="'Source Serif 4', Georgia, serif" font-size="20" font-weight="600">AikiField</text>
  <text x="560" y="78" text-anchor="middle" fill="#8FE6C9" font-size="12" letter-spacing="0.06em">PARRAIN · PHRONESIS EN PRATIQUE</text>

  <!-- branch lines -->
  <path d="M560,92 C560,130 280,130 280,168" stroke="#0E4E44" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M560,92 C560,130 840,130 840,168" stroke="#0E4E44" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ PROJECT 1: AI CHAT ============ -->
  <g id="proj-ai">
    <rect x="40" y="170" width="480" height="560" rx="18" fill="#ffffff" stroke="#E0D9CB" stroke-width="1.5"/>
    <rect x="40" y="170" width="480" height="56" rx="18" fill="#0E4E44"/>
    <rect x="40" y="200" width="480" height="26" fill="#0E4E44"/>
    <text x="280" y="198" text-anchor="middle" fill="#fff" font-family="'Source Serif 4', Georgia, serif" font-size="19" font-weight="600">AikiField AI Chat</text>
    <text x="280" y="216" text-anchor="middle" fill="#8FE6C9" font-size="11" letter-spacing="0.08em">COACHING IA · quantumaikido.com</text>

    <!-- ENTRÉES -->
    <text x="64" y="252" fill="#5A655F" font-size="11" letter-spacing="0.1em">ENTRÉES</text>
    <g font-size="13" fill="#2C3833">
      <rect x="64" y="262" width="200" height="34" rx="8" fill="#F6F2EA" stroke="#E0D9CB"/>
      <text x="164" y="284" text-anchor="middle">Question du membre</text>
      <rect x="276" y="262" width="220" height="34" rx="8" fill="#F6F2EA" stroke="#E0D9CB"/>
      <text x="386" y="284" text-anchor="middle">Corpus d'enseignement (R. Moon)</text>
    </g>

    <!-- arrow down -->
    <path d="M280,296 L280,318" stroke="#0E4E44" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- COMPONENTS -->
    <text x="64" y="334" fill="#5A655F" font-size="11" letter-spacing="0.1em">SYSTÈME CENTRAL</text>
    <g font-size="12.5" fill="#16201C">
      <rect x="64" y="344" width="220" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="174" y="362" text-anchor="middle" font-weight="600">Gemini API</text>
      <text x="174" y="377" text-anchor="middle" font-size="11" fill="#5A655F">brouillons réponse citée</text>

      <rect x="296" y="344" width="200" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="396" y="362" text-anchor="middle" font-weight="600">SQLite FTS5</text>
      <text x="396" y="377" text-anchor="middle" font-size="11" fill="#5A655F">recherche de corpus</text>

      <rect x="64" y="394" width="200" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="164" y="412" text-anchor="middle" font-weight="600">Cloud Run</text>
      <text x="164" y="427" text-anchor="middle" font-size="11" fill="#5A655F">FastAPI · Python</text>

      <rect x="276" y="394" width="220" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="386" y="412" text-anchor="middle" font-weight="600">Firestore</text>
      <text x="386" y="427" text-anchor="middle" font-size="11" fill="#5A655F">sessions · comptes</text>

      <rect x="64" y="444" width="200" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="164" y="462" text-anchor="middle" font-weight="600">Limiteur de débit</text>
      <text x="164" y="477" text-anchor="middle" font-size="11" fill="#5A655F">file d'attente · contrôle des coûts</text>

      <rect x="276" y="444" width="220" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="386" y="462" text-anchor="middle" font-weight="600">Auth</text>
      <text x="386" y="477" text-anchor="middle" font-size="11" fill="#5A655F">e-mail · Google OAuth</text>
    </g>

    <!-- arrow down -->
    <path d="M280,484 L280,506" stroke="#0E4E44" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- SORTIES -->
    <text x="64" y="522" fill="#5A655F" font-size="11" letter-spacing="0.1em">SORTIES</text>
    <g font-size="13" fill="#2C3833">
      <rect x="64" y="532" width="200" height="40" rx="8" fill="#E6F5EF" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="164" y="550" text-anchor="middle" font-weight="600">Réponse citée</text>
      <text x="164" y="565" text-anchor="middle" font-size="11" fill="#5A655F">24h/24 et 7j/7 · gratuit</text>

      <rect x="276" y="532" width="220" height="40" rx="8" fill="#E6F5EF" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="386" y="550" text-anchor="middle" font-weight="600">Escalade vers un coach humain</text>
      <text x="386" y="565" text-anchor="middle" font-size="11" fill="#5A655F">Transfert de lien vidéo</text>
    </g>

    <!-- principle footer -->
    <line x1="64" y1="600" x2="496" y2="600" stroke="#E0D9CB"/>
    <text x="280" y="624" text-anchor="middle" fill="#0E4E44" font-family="'Source Serif 4', Georgia, serif" font-size="14" font-style="italic">Présence inspirée</text>
    <text x="280" y="648" text-anchor="middle" fill="#5A655F" font-size="12">Réponse calme et ancrée face à l'incertitude —</text>
    <text x="280" y="666" text-anchor="middle" fill="#5A655F" font-size="12">détecte quand une question dépasse sa portée.</text>
    <text x="280" y="704" text-anchor="middle" fill="#9A6B14" font-size="11" letter-spacing="0.06em">BUDGET-LIMITÉ · GCP · PORTABLE</text>
  </g>

  <!-- ============ PROJECT 2: STUDIO FINDER ============ -->
  <g id="proj-studio">
    <rect x="600" y="170" width="480" height="560" rx="18" fill="#ffffff" stroke="#E0D9CB" stroke-width="1.5"/>
    <rect x="600" y="170" width="480" height="56" rx="18" fill="#0A3A33"/>
    <rect x="600" y="200" width="480" height="26" fill="#0A3A33"/>
    <text x="840" y="198" text-anchor="middle" fill="#fff" font-family="'Source Serif 4', Georgia, serif" font-size="19" font-weight="600">World Studio Finder</text>
    <text x="840" y="216" text-anchor="middle" fill="#8FE6C9" font-size="11" letter-spacing="0.08em">OUTREACH PIPELINE · DÉCOUVERTE MONDIALE</text>

    <!-- ENTRÉES -->
    <text x="624" y="252" fill="#5A655F" font-size="11" letter-spacing="0.1em">ENTRÉES</text>
    <g font-size="13" fill="#2C3833">
      <rect x="624" y="262" width="140" height="34" rx="8" fill="#F6F2EA" stroke="#E0D9CB"/>
      <text x="694" y="284" text-anchor="middle">Google Maps</text>
      <rect x="774" y="262" width="140" height="34" rx="8" fill="#F6F2EA" stroke="#E0D9CB"/>
      <text x="844" y="284" text-anchor="middle">Places API</text>
      <rect x="924" y="262" width="140" height="34" rx="8" fill="#F6F2EA" stroke="#E0D9CB"/>
      <text x="994" y="284" text-anchor="middle">Hunter.io</text>
    </g>

    <!-- arrow down -->
    <path d="M840,296 L840,318" stroke="#0E4E44" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- COMPONENTS -->
    <text x="624" y="334" fill="#5A655F" font-size="11" letter-spacing="0.1em">PIPELINE PRINCIPAL</text>
    <g font-size="12.5" fill="#16201C">
      <rect x="624" y="344" width="220" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="734" y="362" text-anchor="middle" font-weight="600">Scraper Playwright</text>
      <text x="734" y="377" text-anchor="middle" font-size="11" fill="#5A655F">Grille 2×2 · anti-détection</text>

      <rect x="856" y="344" width="208" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="960" y="362" text-anchor="middle" font-weight="600">Vérificateur d'e-mails</text>
      <text x="960" y="377" text-anchor="middle" font-size="11" fill="#5A655F">NeverBounce · filtre anti-spam</text>

      <rect x="624" y="394" width="220" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="734" y="412" text-anchor="middle" font-weight="600">SQLite (Type 2 SCD)</text>
      <text x="734" y="427" text-anchor="middle" font-size="11" fill="#5A655F">qualité des données · points de contrôle</text>

      <rect x="856" y="394" width="208" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="960" y="412" text-anchor="middle" font-weight="600">Synchronisation Google Sheets</text>
      <text x="960" y="427" text-anchor="middle" font-size="11" fill="#5A655F">enregistrement faisant autorité</text>

      <rect x="624" y="444" width="220" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="734" y="462" text-anchor="middle" font-weight="600">Géo-filtre</text>
      <text x="734" y="477" text-anchor="middle" font-size="11" fill="#5A655F">pays · état · continent</text>

      <rect x="856" y="444" width="208" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="960" y="462" text-anchor="middle" font-weight="600">Compute Engine</text>
      <text x="960" y="477" text-anchor="middle" font-size="11" fill="#5A655F">systemd · GCS</text>
    </g>

    <!-- arrow down -->
    <path d="M840,484 L840,506" stroke="#0E4E44" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- SORTIES -->
    <text x="624" y="522" fill="#5A655F" font-size="11" letter-spacing="0.1em">SORTIES</text>
    <g font-size="13" fill="#2C3833">
      <rect x="624" y="532" width="220" height="40" rx="8" fill="#E6F5EF" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="734" y="550" text-anchor="middle" font-weight="600">Campagnes d'e-mails YAMM</text>
      <text x="734" y="565" text-anchor="middle" font-size="11" fill="#5A655F">publipostage</text>

      <rect x="856" y="532" width="208" height="40" rx="8" fill="#E6F5EF" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="960" y="550" text-anchor="middle" font-weight="600">Soumission de formulaire web</text>
      <text x="960" y="565" text-anchor="middle" font-size="11" fill="#5A655F">studios no-email</text>
    </g>

    <!-- principle footer -->
    <line x1="624" y1="600" x2="1056" y2="600" stroke="#E0D9CB"/>
    <text x="840" y="624" text-anchor="middle" fill="#0E4E44" font-family="'Source Serif 4', Georgia, serif" font-size="14" font-style="italic">Intrication relationnelle</text>
    <text x="840" y="648" text-anchor="middle" fill="#5A655F" font-size="12">Créer des liens à travers la communauté mondiale des arts martiaux à grande échelle.</text>
    <text x="840" y="666" text-anchor="middle" fill="#5A655F" font-size="12">mouvement-arts communauté à grande échelle.</text>
    <text x="840" y="704" text-anchor="middle" fill="#9A6B14" font-size="11" letter-spacing="0.06em">SÉCURISÉ CONTRE LES PLANTAGES · REPRENABLE · OPENTOFU</text>
  </g>
</svg>
