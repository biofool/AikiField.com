    <text x="624" y="252" fill="#5A655F" font-size="11" letter-spacing="0.1em">קלט</text>
    <g font-size="13" fill="#2C3833">
      <rect x="624" y="262" width="140" height="34" rx="8" fill="#F6F2EA" stroke="#E0D9CB"/>
      <text x="694" y="284" text-anchor="middle">Google Maps</text>
      <rect x="774" y="262" width="140" height="34" rx="8" fill="#F6F2EA" stroke="#E0D9CB"/>
      <text x="844" y="284" text-anchor="middle">Places API</text>
      <rect x="924" y="262" width="140" height="34" rx="8" fill="#F6F2EA" stroke="#E0D9CB"/>
      <text x="994" y="284" text-anchor="middle">Hunter.io</text>
    </g>

    <!-- arrow down -->
    <path d="M840,296 L840,318" stroke="#0E4E44" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- COMPONENTS -->
    <text x="624" y="334" fill="#5A655F" font-size="11" letter-spacing="0.1em">תהליך ליבה</text>
    <g font-size="12.5" fill="#16201C">
      <rect x="624" y="344" width="220" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="734" y="362" text-anchor="middle" font-weight="600">Scraper של Playwright</text>
      <text x="734" y="377" text-anchor="middle" font-size="11" fill="#5A655F">רשת 2×2 · נגד זיהוי</text>

      <rect x="856" y="344" width="208" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="960" y="362" text-anchor="middle" font-weight="600">מאמת אימייל</text>
      <text x="960" y="377" text-anchor="middle" font-size="11" fill="#5A655F">NeverBounce · מסנן זבל</text>

      <rect x="624" y="394" width="220" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="734" y="412" text-anchor="middle" font-weight="600">SQLite (סוג 2 של SCD)</text>
      <text x="734" y="427" text-anchor="middle" font-size="11" fill="#5A655F">איכות נתונים · נקודות ביקורת</text>

      <rect x="856" y="394" width="208" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="960" y="412" text-anchor="middle" font-weight="600">סנכרון Google Sheets</text>
      <text x="960" y="427" text-anchor="middle" font-size="11" fill="#5A655F">רשומה סמכותית</text>

      <rect x="624" y="444" width="220" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="734" y="462" text-anchor="middle" font-weight="600">מסנן מיקום גיאוגרפי</text>
      <text x="734" y="477" text-anchor="middle" font-size="11" fill="#5A655F">מדינה · מחוז · יבשת</text>

      <rect x="856" y="444" width="208" height="40" rx="8" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="960" y="462" text-anchor="middle" font-weight="600">Compute Engine</text>
      <text x="960" y="477" text-anchor="middle" font-size="11" fill="#5A655F">systemd · GCS</text>
    </g>

    <!-- arrow down -->
    <path d="M840,484 L840,506" stroke="#0E4E44" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- פלטים -->
    <text x="624" y="522" fill="#5A655F" font-size="11" letter-spacing="0.1em">פלטים</text>
    <g font-size="13" fill="#2C3833">
      <rect x="624" y="532" width="220" height="40" rx="8" fill="#E6F5EF" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="734" y="550" text-anchor="middle" font-weight="600">קמפיינים במייל YAMM</text>
      <text x="734" y="565" text-anchor="middle" font-size="11" fill="#5A655F">מיזוג דואר</text>

      <rect x="856" y="532" width="208" height="40" rx="8" fill="#E6F5EF" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="960" y="550" text-anchor="middle" font-weight="600">שליחת טופס אינטרנט</text>
      <text x="960" y="565" text-anchor="middle" font-size="11" fill="#5A655F">סטודיו no-email</text>
    </g>

    <!-- principle footer -->
    <line x1="624" y1="600" x2="1056" y2="600" stroke="#E0D9CB"/>
    <text x="840" y="624" text-anchor="middle" fill="#0E4E44" font-family="'Source Serif 4', Georgia, serif" font-size="14" font-style="italic">הסתבכות יחסית</text>
    <text x="840" y="648" text-anchor="middle" fill="#5A655F" font-size="12">בניית קשר ברחבי הקהילה הגלובלית</text>
    <text x="840" y="666" text-anchor="middle" fill="#5A655F" font-size="12">של אמנויות תנועה בהיקף רחב.</text>
    <text x="840" y="704" text-anchor="middle" fill="#9A6B14" font-size="11" letter-spacing="0.06em">עמיד בפני קריסות · ניתן להמשך · OPENTOFU</text>
