      <text x="164" y="565" text-anchor="middle" font-size="11" fill="#5A655F">24/7 · חינם</text>

      <rect x="276" y="532" width="220" height="40" rx="8" fill="#E6F5EF" stroke="#5FD3B2" stroke-width="1.5"/>
      <text x="386" y="550" text-anchor="middle" font-weight="600">הסלמה למאמן אנושי</text>
      <text x="386" y="565" text-anchor="middle" font-size="11" fill="#5A655F">העברת קישור וידאו</text>
    </g>

    <!-- principle footer -->
    <line x1="64" y1="600" x2="496" y2="600" stroke="#E0D9CB"/>
    <text x="280" y="624" text-anchor="middle" fill="#0E4E44" font-family="'Source Serif 4', Georgia, serif" font-size="14" font-style="italic">נוכחות בהשראה</text>
    <text x="280" y="648" text-anchor="middle" fill="#5A655F" font-size="12">תגובה רגועה ומבוססת בחוסר ודאות —</text>
    <text x="280" y="666" text-anchor="middle" fill="#5A655F" font-size="12">חש מתי שאלה חורגת מהיקפה.</text>
    <text x="280" y="704" text-anchor="middle" fill="#9A6B14" font-size="11" letter-spacing="0.06em">תקציב מוגבל · GCP · נייד</text>
  </g>

  <!-- ============ PROJECT 2: STUDIO FINDER ============ -->
  <g id="proj-studio">
