<svg direction="rtl" xml:lang="he" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1040" font-family="Noto Sans JP, Noto Sans SC, Noto Sans KR, Noto Naskh Arabic, Noto Sans Hebrew, Noto Sans Devanagari, Public Sans, sans-serif" role="img" aria-labelledby="sf-title sf-desc">
  <title id="sf-title">World Studio Finder — צינור גילוי והפצה</title>
  <desc id="sf-desc">צינור: מיקוד גיאוגרפי של אזורי עולם, גירוד של Google Maps באמצעות Playwright עם גיבוי Places API, מציאת ואימות אימיילים, סנכרון ל-Google Sheets, ואז הפעלת קמפיינים של YAMM או שליחות טפסים אוטומטיות.</desc>

  <defs>
    <marker id="sf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E4E44"/>
    </marker>
    <marker id="sf-arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5FD3B2"/>
    </marker>
    <marker id="sf-arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9A6B14"/>
    </marker>
  </defs>

  <rect width="820" height="1040" fill="#F6F2EA"/>

  <!-- title -->
  <text x="410" y="44" text-anchor="middle" fill="#16201C" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600">World Studio Finder — צינור</text>
  <text x="410" y="68" text-anchor="middle" fill="#5A655F" font-size="13">מגירוד מפות עולמיות להפצה מאומתת בקנה מידה</text>

  <!-- Step 1: Geo-target -->
  <rect x="260" y="96" width="300" height="58" rx="12" fill="#0A3A33"/>
  <text x="410" y="120" text-anchor="middle" fill="#fff" font-weight="600" font-size="15">1 · מיקוד אזורים גיאוגרפי</text>
  <text x="410" y="140" text-anchor="middle" fill="#8FE6C9" font-size="12">מדינה · מדינת ארה"ב · אזור זמן · יבשת · רשת משושה</text>
  <path d="M410,154 L410,182" stroke="#0E4E44" stroke-width="2" marker-end="url(#sf-arrow)"/>

  <!-- Step 2: Scrape (parallel paths) -->
  <text x="160" y="200" fill="#5A655F" font-size="11" letter-spacing="0.1em">ראשי</text>
  <rect x="60" y="210" width="300" height="70" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="210" y="234" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">2א · Playwright scrape</text>
  <text x="210" y="252" text-anchor="middle" fill="#5A655F" font-size="11.5">Google Maps · חיפוש ברשת דו-ממדית</text>
  <text x="210" y="268" text-anchor="middle" fill="#5A655F" font-size="11.5">נגד זיהוי · יוגה/טאי צ'י/קפוארה/סומטיקה</text>

  <text x="660" y="200" fill="#5A655F" font-size="11" letter-spacing="0.1em">חלופי</text>
  <rect x="460" y="210" width="300" height="70" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="610" y="234" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">2ב · Google Places API</text>
  <text x="610" y="252" text-anchor="middle" fill="#5A655F" font-size="11.5">כאשר הגירוד נחסם</text>
  <text x="610" y="268" text-anchor="middle" fill="#5A655F" font-size="11.5">Geocoding API עבור קואורדינטות</text>

  <!-- converge -->
  <path d="M210,280 L210,310 L410,310 L410,338" stroke="#0E4E44" stroke-width="2" fill="none" marker-end="url(#sf-arrow)"/>
  <path d="M610,280 L610,310 L410,310" stroke="#0E4E44" stroke-width="2" fill="none"/>

  <!-- Step 3: Studio records -->
  <rect x="210" y="340" width="400" height="58" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="410" y="364" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">3 · רשומות סטודיו שנאספו</text>
  <text x="410" y="382" text-anchor="middle" fill="#5A655F" font-size="11.5">שם · כתובת · אתר אינטרנט · טלפון · קטגוריה</text>
  <path d="M410,398 L410,426" stroke="#0E4E44" stroke-width="2" marker-end="url(#sf-arrow)"/>

  <!-- Step 4: Email discovery (parallel) -->
  <text x="160" y="444" fill="#5A655F" font-size="11" letter-spacing="0.1em">מציאת דוא"ל</text>
  <rect x="60" y="454" width="300" height="58" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="210" y="478" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">4א · בדיקת Hunter.io</text>
  <text x="210" y="496" text-anchor="middle" fill="#5A655F" font-size="11.5">גילוי דוא"ל מבוסס דומיין</text>

  <text x="660" y="444" fill="#5A655F" font-size="11" letter-spacing="0.1em">גירוד</text>
  <rect x="460" y="454" width="300" height="58" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="610" y="478" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">4ב · גירוד אתר אינטרנט</text>
  <text x="610" y="496" text-anchor="middle" fill="#5A655F" font-size="11.5">סריקת אתר ישירה לפרטי קשר</text>

  <!-- converge -->
  <path d="M210,512 L210,540 L410,540 L410,568" stroke="#0E4E44" stroke-width="2" fill="none" marker-end="url(#sf-arrow)"/>
  <path d="M610,512 L610,540 L410,540" stroke="#0E4E44" stroke-width="2" fill="none"/>

  <!-- Step 5: Verify -->
  <rect x="210" y="570" width="400" height="58" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="410" y="594" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">5 · אימות + סינון אימיילים</text>
  <text x="410" y="612" text-anchor="middle" fill="#5A655F" font-size="11.5">NeverBounce deliverability · סינון דומיינים זבל</text>
  <path d="M410,628 L410,656" stroke="#0E4E44" stroke-width="2" marker-end="url(#sf-arrow)"/>

  <!-- Step 6: Store -->
  <rect x="160" y="658" width="500" height="70" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="410" y="682" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">6 · אחסון + סנכרון</text>
  <text x="410" y="700" text-anchor="middle" fill="#5A655F" font-size="11.5">SQLite (SCD Type 2 איכות נתונים) · JSONL checkpointing</text>
  <text x="410" y="716" text-anchor="middle" fill="#5A655F" font-size="11.5">סנכרון Google Sheets — רשומה סמכותית, מוכן ל-YAMM</text>
  <path d="M410,728 L410,756" stroke="#0E4E44" stroke-width="2" marker-end="url(#sf-arrow)"/>

  <!-- Step 7: Decision — has אימייל? -->
  <polygon points="410,758 580,820 410,882 240,820" fill="#ffffff" stroke="#0E4E44" stroke-width="1.5"/>
  <text x="410" y="812" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">7 · האם אומת</text>
  <text x="410" y="832" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">אימייל?</text>

  <!-- כן branch (left) -->
  <text x="200" y="816" text-anchor="middle" fill="#0E4E44" font-size="13" font-weight="600">כן</text>
  <path d="M240,820 L140,820 L140,906" stroke="#5FD3B2" stroke-width="2" fill="none" marker-end="url(#sf-arrow-mint)"/>

  <!-- NO branch (right) -->
  <text x="620" y="816" text-anchor="middle" fill="#9A6B14" font-size="13" font-weight="600">לא (אתר בלבד)</text>
  <path d="M580,820 L680,820 L680,906" stroke="#9A6B14" stroke-width="2" fill="none" marker-end="url(#sf-arrow-gold)"/>

  <!-- Step 8a: YAMM -->
  <rect x="20" y="908" width="240" height="70" rx="10" fill="#E6F5EF" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="140" y="934" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">8a · מיזוג דואר YAMM</text>
  <text x="140" y="952" text-anchor="middle" fill="#5A655F" font-size="11.5">קמפיינים ממוקדי דוא"ל לפי אזור גיאוגרפי</text>
  <text x="140" y="968" text-anchor="middle" fill="#5A655F" font-size="11.5">קריאות בסדר עמודות בזמן אמת</text>

  <!-- Step 8b: Web form -->
  <rect x="560" y="908" width="240" height="70" rx="10" fill="#FBF1DD" stroke="#9A6B14" stroke-width="1.5"/>
  <text x="680" y="934" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">8b · שליחת טופס אינטרנט</text>
  <text x="680" y="952" text-anchor="middle" fill="#5A655F" font-size="11.5">טופס יצירת קשר אוטומטי</text>
  <text x="680" y="968" text-anchor="middle" fill="#5A655F" font-size="11.5">שליחה עבור סטודיו ללא דוא"ל</text>

  <!-- infrastructure footer -->
  <line x1="60" y1="996" x2="760" y2="996" stroke="#E0D9CB"/>
  <text x="410" y="1020" text-anchor="middle" fill="#5A655F" font-size="12">
    <tspan font-weight="600" fill="#0E4E44">תשתית:</tspan> GCP Compute Engine (systemd) · GCS · Flask · Terraform/OpenTofu · algorithm-version tracking
  </text>
</svg>
