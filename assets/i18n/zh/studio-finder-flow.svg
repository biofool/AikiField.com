<svg xml:lang="zh" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1040" font-family="Noto Sans JP, Noto Sans SC, Noto Sans KR, Noto Naskh Arabic, Noto Sans Hebrew, Noto Sans Devanagari, Public Sans, sans-serif" role="img" aria-labelledby="sf-title sf-desc">
  <title id="sf-title">世界工作室查找器 — 发现与外展管道</title>
  <desc id="sf-desc">管道：地理定位世界区域，通过 Playwright 抓取 Google Maps，并使用 Places API 作为后备，查找并验证电子邮件，同步到 Google Sheets，然后运行 YAMM 电子邮件营销活动或自动网页表单提交。</desc>

  <defs>
    <marker id="sf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E4E44"/>
    </marker>
    <marker id="sf-arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5FD3B2"/>
    </marker>
    <marker id="sf-arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9A6B14"/>
    </marker>
  </defs>

  <rect width="820" height="1040" fill="#F6F2EA"/>

  <!-- title -->
  <text x="410" y="44" text-anchor="middle" fill="#16201C" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="600">世界工作室查找器 — 管道</text>
  <text x="410" y="68" text-anchor="middle" fill="#5A655F" font-size="13">从全球地图抓取到大规模验证外展</text>

  <!-- Step 1: Geo-target -->
  <rect x="260" y="96" width="300" height="58" rx="12" fill="#0A3A33"/>
  <text x="410" y="120" text-anchor="middle" fill="#fff" font-weight="600" font-size="15">1 · 地理定位区域</text>
  <text x="410" y="140" text-anchor="middle" fill="#8FE6C9" font-size="12">国家 · 美国州 · 时区 · 大陆 · 十六进制网格</text>
  <path d="M410,154 L410,182" stroke="#0E4E44" stroke-width="2" marker-end="url(#sf-arrow)"/>

  <!-- Step 2: Scrape (parallel paths) -->
  <text x="160" y="200" fill="#5A655F" font-size="11" letter-spacing="0.1em">主</text>
  <rect x="60" y="210" width="300" height="70" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="210" y="234" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">2a · Playwright 抓取</text>
  <text x="210" y="252" text-anchor="middle" fill="#5A655F" font-size="11.5">Google Maps · 2×2 网格搜索</text>
  <text x="210" y="268" text-anchor="middle" fill="#5A655F" font-size="11.5">反检测 · yoga/tai chi/capoeira/somatic</text>

  <text x="660" y="200" fill="#5A655F" font-size="11" letter-spacing="0.1em">备用</text>
  <rect x="460" y="210" width="300" height="70" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="610" y="234" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">2b · Google Places API</text>
  <text x="610" y="252" text-anchor="middle" fill="#5A655F" font-size="11.5">当抓取被阻止时</text>
  <text x="610" y="268" text-anchor="middle" fill="#5A655F" font-size="11.5">用于坐标的地理编码 API</text>

  <!-- converge -->
  <path d="M210,280 L210,310 L410,310 L410,338" stroke="#0E4E44" stroke-width="2" fill="none" marker-end="url(#sf-arrow)"/>
  <path d="M610,280 L610,310 L410,310" stroke="#0E4E44" stroke-width="2" fill="none"/>

  <!-- Step 3: Studio records -->
  <rect x="210" y="340" width="400" height="58" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="410" y="364" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">3 · 收集的工作室记录</text>
  <text x="410" y="382" text-anchor="middle" fill="#5A655F" font-size="11.5">名称 · 地址 · 网站 · 电话 · 类别</text>
  <path d="M410,398 L410,426" stroke="#0E4E44" stroke-width="2" marker-end="url(#sf-arrow)"/>

  <!-- Step 4: Email discovery (parallel) -->
  <text x="160" y="444" fill="#5A655F" font-size="11" letter-spacing="0.1em">查找电子邮件</text>
  <rect x="60" y="454" width="300" height="58" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="210" y="478" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">4a · Hunter.io 查询</text>
  <text x="210" y="496" text-anchor="middle" fill="#5A655F" font-size="11.5">基于域名的电子邮件发现</text>

  <text x="660" y="444" fill="#5A655F" font-size="11" letter-spacing="0.1em">抓取</text>
  <rect x="460" y="454" width="300" height="58" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="610" y="478" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">4b · 网站抓取</text>
  <text x="610" y="496" text-anchor="middle" fill="#5A655F" font-size="11.5">直接网站爬取联系信息</text>

  <!-- converge -->
  <path d="M210,512 L210,540 L410,540 L410,568" stroke="#0E4E44" stroke-width="2" fill="none" marker-end="url(#sf-arrow)"/>
  <path d="M610,512 L610,540 L410,540" stroke="#0E4E44" stroke-width="2" fill="none"/>

  <!-- Step 5: Verify -->
  <rect x="210" y="570" width="400" height="58" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="410" y="594" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">5 · 验证 + 过滤电子邮件</text>
  <text x="410" y="612" text-anchor="middle" fill="#5A655F" font-size="11.5">NeverBounce 可送达性 · 垃圾域名过滤</text>
  <path d="M410,628 L410,656" stroke="#0E4E44" stroke-width="2" marker-end="url(#sf-arrow)"/>

  <!-- Step 6: Store -->
  <rect x="160" y="658" width="500" height="70" rx="10" fill="#ffffff" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="410" y="682" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">6 · 存储 + 同步</text>
  <text x="410" y="700" text-anchor="middle" fill="#5A655F" font-size="11.5">SQLite (SCD Type 2 数据质量) · JSONL 检查点</text>
  <text x="410" y="716" text-anchor="middle" fill="#5A655F" font-size="11.5">Google Sheets 同步 — 权威记录，YAMM 就绪</text>
  <path d="M410,728 L410,756" stroke="#0E4E44" stroke-width="2" marker-end="url(#sf-arrow)"/>

  <!-- Step 7: Decision — has 电子邮件？ -->
  <polygon points="410,758 580,820 410,882 240,820" fill="#ffffff" stroke="#0E4E44" stroke-width="1.5"/>
  <text x="410" y="812" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">7 · 已验证</text>
  <text x="410" y="832" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">电子邮件？</text>

  <!-- 是 branch (left) -->
  <text x="200" y="816" text-anchor="middle" fill="#0E4E44" font-size="13" font-weight="600">是</text>
  <path d="M240,820 L140,820 L140,906" stroke="#5FD3B2" stroke-width="2" fill="none" marker-end="url(#sf-arrow-mint)"/>

  <!-- NO branch (right) -->
  <text x="620" y="816" text-anchor="middle" fill="#9A6B14" font-size="13" font-weight="600">否 (仅网站)</text>
  <path d="M580,820 L680,820 L680,906" stroke="#9A6B14" stroke-width="2" fill="none" marker-end="url(#sf-arrow-gold)"/>

  <!-- Step 8a: YAMM -->
  <rect x="20" y="908" width="240" height="70" rx="10" fill="#E6F5EF" stroke="#5FD3B2" stroke-width="1.5"/>
  <text x="140" y="934" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">8a · YAMM 邮件合并</text>
  <text x="140" y="952" text-anchor="middle" fill="#5A655F" font-size="11.5">地理位置筛选的电子邮件营销活动</text>
  <text x="140" y="968" text-anchor="middle" fill="#5A655F" font-size="11.5">实时列顺序读取</text>

  <!-- Step 8b: Web form -->
  <rect x="560" y="908" width="240" height="70" rx="10" fill="#FBF1DD" stroke="#9A6B14" stroke-width="1.5"/>
  <text x="680" y="934" text-anchor="middle" fill="#16201C" font-weight="600" font-size="14">8b · 网页表单提交</text>
  <text x="680" y="952" text-anchor="middle" fill="#5A655F" font-size="11.5">自动联系表单</text>
  <text x="680" y="968" text-anchor="middle" fill="#5A655F" font-size="11.5">无电子邮件工作室的提交</text>

  <!-- infrastructure footer -->
  <line x1="60" y1="996" x2="760" y2="996" stroke="#E0D9CB"/>
  <text x="410" y="1020" text-anchor="middle" fill="#5A655F" font-size="12">
    <tspan font-weight="600" fill="#0E4E44">基础设施:</tspan> GCP Compute Engine (systemd) · GCS · Flask · Terraform/OpenTofu · algorithm-version tracking
  </text>
</svg>
