- component:
    name: htaccess
    path: .htaccess
  depends_on:
    - {type: runtime, target: "Apache mod_rewrite, mod_headers, mod_authz_host, mod_expires"}
  used_by:
    - {type: code, target: coach-proxy.php}
    - {type: infra, target: "all requests (origin lock, security headers, caching)"}
  interfaces:
    - "RewriteRule ^coach-api(/.*)?$ coach-proxy.php [L]"
    - "RewriteRule ^projects.html$ /projects.php [R=301,L]"
    - "RewriteRule ^beta/assessment.html$ /beta/assessment.php [R=301,L]"
    - "Require ip <Cloudflare CIDR ranges>"
  data_stores: []
  configuration: []
  runtime_workflows:
    - coaching-auth-flow
    - deploy
  decisions:
    - "Origin lock: CF IP allow-list only"
    - "HSTS: max-age=63072000; includeSubDomains"
    - "HTML cache 1h, assets cache 1yr immutable"
  known_risks:
    - "IP list must stay in sync with includes/cloudflare-ips.php"
    - "mod_authz_host fallback (mod_rewrite) is IPv4-only"
  security_sensitive: true
  operationally_sensitive: true
  before_modifying:
    - "Update includes/cloudflare-ips.php to match IP changes"
    - "Test redirect rules with tests/e2e/specs/redirects.spec.js"
    - "Verify security headers don't conflict with Cloudflare edge settings"
  test_map_target: redirects
  evidence:
    - {path: .htaccess, lines: "1-162", evidence_type: source}

- component:
    name: sync-deploy
    path: sync.sh
  depends_on:
    - {type: runtime, target: "rsync, ssh, php (for lint), bash"}
    - {type: config, target: ".env.secrets (CLOUDFLARE_API_TOKEN)"}
    - {type: external, target: "peec.biz (SSH)"}
    - {type: code, target: scripts/verify-cloudflare-ips.php}
  used_by:
    - {type: operator, target: "human → ./sync.sh deploy"}
  interfaces:
    - "./sync.sh dryrun|deploy|upload|download|logs|report|help"
    - "--staging | --prod"
  data_stores: []
  configuration:
    - ".env.secrets"
  runtime_workflows:
    - deploy
  decisions:
    - "PHP lint pre-deploy gate (aborts on error)"
    - "CF IP check pre-deploy (warn-only)"
    - "coach-config.staging.php excluded from prod"
    - "All *.md, *.py, *.sh, scripts/, tests/ excluded from deploy"
  known_risks:
    - "Production-sensitive — always dryrun first"
    - "SSH key required (quantumaikido_ed25519)"
  security_sensitive: true
  operationally_sensitive: true
  before_modifying:
    - "Verify EXCLUDES still excludes secrets"
    - "Test with dryrun before deploy"
    - "Check that coach-config.local.php reaches server (NOT excluded)"
  test_map_target: deploy
  evidence:
    - {path: sync.sh, lines: "1-670", evidence_type: source}
