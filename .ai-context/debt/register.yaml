- id: DEBT-007
  classification: code-smell
  summary: >
    Session cookie setup is duplicated between login.php and
    beta-gate.load.php — same session_set_cookie_params() block copied
    verbatim. Drift between the two would break the shared session contract.
  impact: 4
  likelihood: 2
  reach: 4
  priority_score: 32
  evidence:
    - path: login.php
      lines: "126-136"
      evidence_type: source
    - path: includes/beta-gate.load.php
      lines: "54-64"
      evidence_type: source
      note: "identical cookie params (7-day, path=/, httponly, samesite=Lax)"
  remediation: >
    Extract session initialization into a shared include (e.g.
    includes/session.load.php) that both files require_once.
  status: open

- id: DEBT-008
  classification: architectural-risk
  summary: >
    Cloudflare IP list in includes/cloudflare-ips.php is a static snapshot
    (2026-08-11) that can go stale. .htaccess mirrors a separate IP list
    for mod_authz_host. Both must be manually updated and kept in sync.
    Stale lists degrade rate-limiting accuracy and origin-lock security.
  impact: 4
  likelihood: 3
  reach: 4
  priority_score: 48
  evidence:
    - path: includes/cloudflare-ips.php
      lines: "1-178"
      evidence_type: source
      note: "snapshot from cloudflare.com/ips-v4 and /ips-v6 (2026-08-11)"
    - path: .htaccess
      evidence_type: source
      note: "separate Require ip directives with CIDR ranges"
    - path: scripts/verify-cloudflare-ips.php
      evidence_type: source
      note: "exists but is warn-only in sync.sh, not automated"
  remediation: >
    Automate verify-cloudflare-ips.php in CI or a cron job. Consider
    generating .htaccess IP directives from cloudflare-ips.php to eliminate
    dual-maintenance.
  status: open

