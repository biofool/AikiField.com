- id: DEBT-001
  classification: confirmed-defect
  summary: >
    coach-proxy.php OAuth Location rewrite targets /projects.php, but
    projects.php no longer loads coach-login.js (moved to /login.php). If
    Google OAuth is re-enabled, the OTC exchange would break — the user
    would land on /projects.php which has no coach-login.js to complete
    the flow.
  impact: 4
  likelihood: 2
  reach: 3
  priority_score: 24
  evidence:
    - path: coach-proxy.php
      lines: "246-261"
      evidence_type: source
      note: "str_replace('/login.html', '/projects.php', ...) — stale target"
    - path: coach-proxy.php
      lines: "8-9"
      evidence_type: source
      note: "docblock says 'targets /projects.php (AikiField's login page)'"
    - path: docs/coach-auth-prd.md
      lines: "178-181"
      evidence_type: doc
      note: "PRD says rewrite should target /login.php, not /projects.php"
    - path: projects.php
      lines: "7-14"
      evidence_type: source
      note: "projects.php is now public — no login or chat on this page"
  remediation: >
    Change str_replace target from '/projects.php' to '/login.php' in
    coach-proxy.php line 259. Update the docblock on lines 8-9. Verify
    coach-login.js on login.php handles the oauth_code OTC query param.
  status: open

- id: DEBT-002
  classification: architectural-risk
  summary: >
    beta-gate.load.php fails open on backend unreachable — revoked or
    disabled sessions remain valid for up to 6h during a backend outage.
    The sister repo (quantumaikido.com) now verifies sessions per-request;
    AikiField uses a 6h cadence.
  impact: 4
  likelihood: 3
  reach: 3
  priority_score: 36
  evidence:
    - path: includes/beta-gate.load.php
      lines: "106-113"
      evidence_type: source
      note: "null return → fail open, record failure for backoff"
    - path: includes/beta-gate.load.php
      lines: "80"
      evidence_type: source
      note: "BETA_REVALIDATE_INTERVAL_SECONDS = 6 * 3600"
    - path: docs/coach-auth-prd.md
      lines: "215"
      evidence_type: doc
      note: "QA now per-request; AikiField 6h deemed sufficient"
  remediation: >
    Consider shortening revalidation interval or adding a fail-closed mode
    for security-sensitive beta pages. Document the tradeoff explicitly.
  status: open

- id: DEBT-003
  classification: architectural-risk
  summary: >
    Dashboard admin key passed via ?key= query parameter — may be logged
    by proxies, Cloudflare edge, or browser history. The X-Dashboard-Key
    header alternative exists but the HTML UI links embed the key in URLs.
  impact: 3
  likelihood: 4
  reach: 2
  priority_score: 24
  evidence:
    - path: dashboard.php
      lines: "22, 176-179"
      evidence_type: source
      note: "$_GET['key'] accepted; nav links embed ?key= in href"
    - path: dashboard.php
      lines: "29"
      evidence_type: source
      note: "hash_equals() used — timing-safe, but key still in URL"
  remediation: >
    Prefer X-Dashboard-Key header for API access. For HTML UI, consider
    session-based auth or a short-lived token cookie instead of query param.
  status: open

