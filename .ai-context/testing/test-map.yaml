# ── i18n (locale-utils.js, language-selector.js, data/i18n-*) ──────────
- target: i18n
  e2e: []
  unit:
    - "node tests/test_locale_path.js"
  typecheck: []
  lint: []
  notes: >
    test_locale_path.js is a standalone Node.js script testing locale-utils.js
    path detection, URL building, and canonical link logic with mock browser
    environment. tests/locale-router.php is a PHP built-in server router for
    manual local testing (php -S 0.0.0.0:8080 tests/locale-router.php), not
    an automated test.

