# ── deploy (sync.sh) ───────────────────────────────────────────────────
- target: deploy
  e2e: []
  unit: []
  typecheck: []
  lint:
    - "find . -name '*.php' -not -path '*/vendor/*' -not -path '*/tests/*' -exec php -l {} +"
  validation:
    - "./sync.sh dryrun"
    - "./sync.sh dryrun --staging"
  notes: >
    sync.sh runs php_lint() as a pre-deploy gate (aborts on syntax error) and
    verify-cloudflare-ips.php as a warn-only check. SKIP_PHP_LINT=1 bypasses
    the lint gate. dryrun requires SSH key + network to peec.biz. No automated
    test for the deploy process itself.

# ── full-suite (run everything) ────────────────────────────────────────
- target: full-suite
  e2e:
    - "bash tests/e2e/run.sh"
  unit:
    - "php tests/unit/test-cloudflare-ip-trust.php"
    - "python3 tests/unit/test_allocate_cloudflare_token.py"
    - "node tests/test_locale_path.js"
  typecheck: []
  lint:
    - "find . -name '*.php' -not -path '*/vendor/*' -not -path '*/tests/*' -exec php -l {} +"
  notes: >
    No CI/CD pipeline exists (no .github/workflows/). All validation is manual.
    E2e suite requires PHP + Node.js + Playwright (npm install in tests/e2e/).
