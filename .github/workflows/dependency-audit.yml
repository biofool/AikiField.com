# Scheduled dependency audit — layer 2 of the SCA gate (see AGENTS.md
# "Dependency vulnerability gating"). Runs scripts/audit-deps.sh against the
# committed lockfiles on the default branch daily, so CVEs disclosed *after*
# code merged still surface. On findings the job FAILS and opens (or updates)
# a tracking issue — an audit that only logs is invisible.
#
# Layer 3 (deploy gate) is wiring deploy jobs to `needs:` this check, or
# calling `bash scripts/audit-deps.sh` as a preflight step in local deploy
# scripts (sync.sh / deploy.sh) that exits non-zero on findings.
name: Dependency Audit

on:
  schedule:
    - cron: "23 6 * * *"   # daily 06:23 UTC — off the top of the hour
  workflow_dispatch:

permissions:
  contents: read
  issues: write            # open/update the tracking issue on findings

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships Node + Python + pipx. Install auditors that are
      # not preinstalled; extend this list when adding ecosystems.
      - name: Install auditors
        run: |
          pipx install pip-audit 2>/dev/null || pip install pip-audit

      - name: Run dependency audit
        id: audit
        run: |
          if [ ! -f scripts/audit-deps.sh ]; then
            echo "scripts/audit-deps.sh missing — sync it from biofool/starter" | tee audit-report.txt
            exit 1
          fi
          bash scripts/audit-deps.sh | tee audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: audit-report.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Open or update tracking issue on findings
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create dependency-audit --color B60205 --description "Scheduled dependency audit findings" 2>/dev/null || true
          issue=$(gh issue list --state open --label dependency-audit --limit 1 --json number --jq '.[0].number')
          body=$(printf 'The scheduled dependency audit reported findings.\n\nWorkflow run: %s\n\n```\n%s\n```' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$(tail -c 55000 audit-report.txt)")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
            echo "Updated existing tracking issue #$issue"
          else
            gh issue create --title "Dependency audit findings on $(date -u +%Y-%m-%d)" --label dependency-audit --body "$body"
            echo "Opened new tracking issue"
          fi
